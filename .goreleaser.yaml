version: 2

project_name: rute

before:
  hooks:
    - go mod verify

builds:
  - id: rute
    main: ./cmd/proxy
    binary: rute
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.buildDate={{ .Date }}
    targets:
      - darwin_amd64_v1
      - darwin_arm64
      - linux_amd64_v1
      - linux_arm64

archives:
  - ids:
      - rute
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

sboms:
  - id: archives
    artifacts: archive

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"

release:
  prerelease: auto

homebrew_casks:
  - name: rute
    binaries:
      - rute
    directory: Casks
    homepage: https://github.com/dio/rute
    description: Loopback OpenAI-compatible proxy backed by Codex OAuth
    skip_upload: auto
    repository:
      owner: dio
      name: homebrew-tap
      branch: main
      git:
        url: ssh://git@github.com/dio/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_PRIVATE_KEY }}"
    commit_author:
      name: rute release bot
      email: rute-release@users.noreply.github.com
    commit_msg_template: "rute cask {{ .Tag }}"

report_sizes: true
