{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light dark; --fg: #111; --muted: #6b6b6b; --line: #e2e2e2; --bg: #fff; --field: #f4f4f4; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8e8e8; --muted: #8f8f8f; --line: #2c2c2c; --bg: #111; --field: #1c1c1c; } }
* { box-sizing: border-box; }
body { margin: 24px; max-width: 1180px; background: var(--bg); color: var(--fg);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
header { display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--fg); }
header b { font-size: 15px; }
.muted, th { color: var(--muted); }
a { color: var(--fg); }
nav a { margin-right: 10px; }
nav a.on { font-weight: bold; text-decoration: none; }
h2 { margin: 28px 0 6px; font-size: 12px; font-weight: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h3 { margin: 16px 0 4px; font-size: 13px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 3px 14px 3px 0; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-weight: normal; }
td.n, th.n { text-align: right; }
.attention { font-weight: bold; }
form.inline { display: inline; margin: 0; }
button, input, select { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--muted); padding: 3px 8px; }
button { cursor: pointer; }
label { display: block; margin: 10px 0 2px; color: var(--muted); }
.box { border: 1px solid var(--fg); padding: 12px 16px; margin-top: 16px; max-width: 640px; word-break: break-all; }
</style>
{{end}}
